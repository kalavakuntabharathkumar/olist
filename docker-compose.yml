services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  orders-service:
    build: ./orders-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/olist
      SPRING_DATASOURCE_USERNAME: olist
      SPRING_DATASOURCE_PASSWORD: olist
    depends_on:
      - postgres
    ports:
      - "8081:8080"

  catalog-service:
    build: ./catalog-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/olist
      SPRING_DATASOURCE_USERNAME: olist
      SPRING_DATASOURCE_PASSWORD: olist
    depends_on:
      - postgres
    ports:
      - "8082:8080"

volumes:
  pgdata:
